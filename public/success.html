<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reservation Status | ER Limousine Service</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/">ER <span>LIMOUSINE</span> SERVICE</a>
      <a class="nav-cta" href="/">Home</a>
    </div>
  </nav>

  <main class="section">
    <div class="wrap" style="max-width:760px">
      <div class="booking-card">
        <div class="eyebrow">Reservation received</div>
        <h2 style="margin-top:10px">Thank you.</h2>
        <p id="message">Checking your reservation…</p>
        <div id="details"></div>
        <button id="completePayment" class="btn btn-primary" type="button" hidden>Complete Payment</button>
        <button id="refreshReservation" class="btn" type="button">Refresh Reservation Status</button>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/">Book another ride</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const id=new URLSearchParams(location.search).get('booking');
      const message=document.getElementById('message'),details=document.getElementById('details');
      const pay=document.getElementById('completePayment'),refresh=document.getElementById('refreshReservation');
      let generation=0,busy=false,endpoint=null;
      const valid=typeof id==='string'&&/^[a-f0-9-]{36}$/i.test(id);
      const row=(label,value)=>{const r=document.createElement('div');r.className='summary-row';const l=document.createElement('span'),v=document.createElement('strong');l.textContent=label;v.textContent=String(value);r.append(l,v);details.append(r);};
      async function load(){
        const g=++generation;details.replaceChildren();pay.hidden=true;endpoint=null;message.textContent='Checking your reservation…';
        if(!valid){message.textContent='Reservation access unavailable.';return;}
        try{
          let response=await fetch('/api/booking/'+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store',referrerPolicy:'no-referrer'});
          let account=false;
          if(response.status===401){response=await fetch('/api/customer/trips/'+encodeURIComponent(id),{credentials:'same-origin',cache:'no-store',referrerPolicy:'no-referrer'});account=true;}
          if(!response.ok)throw Error('unavailable');
          const data=await response.json();if(g!==generation)return;
          const b=account?data.trip:data,t=account?b:b.trip,q=account?b:b.quote;
          const paid=b.paymentStatus==='paid',cancelled=b.status==='cancelled',processing=b.paymentVerificationPending===true;
          message.textContent=paid&&cancelled?'Payment received for this cancelled reservation. Please contact ER Limousine Service for payment review.':paid?'Payment received. Your reservation is confirmed.':cancelled?'This reservation is cancelled.':processing?'We’re confirming your payment. You do not need to pay again.':'Your trip has been reserved. Payment is still required.';
          row('Reservation',account?b.reference:b.id);row('Pickup',t.pickup);row('Destination',t.dropoff);row('Date / time',t.date+' '+t.time);
          row('Vehicle',q.vehicle);row('Total',new Intl.NumberFormat('en-US',{style:'currency',currency:q.currency||'usd'}).format(q.total));
          row('Payment',paid?'Paid':processing?'Payment verification in progress':'Payment Pending / Unpaid');
          if(b.paymentHoldExpiresAt&&!paid&&!cancelled)row('Start payment before',new Intl.DateTimeFormat('en-US',{dateStyle:'medium',timeStyle:'short',timeZone:'America/New_York'}).format(new Date(b.paymentHoldExpiresAt))+' (New York time)');
          if(t.returnDate)row('Return pickup',t.returnDate+' '+t.returnTime);
          endpoint=account?'/api/customer/trips/'+encodeURIComponent(id)+'/payment':'/api/booking/'+encodeURIComponent(id)+'/checkout';pay.hidden=paid||cancelled||processing;
        }catch(_){if(g===generation)message.textContent='Unable to load this reservation. Please retry.';}
      }
      pay.addEventListener('click',async()=>{
        if(busy||!endpoint)return;const g=generation;busy=true;pay.disabled=true;
        try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:'{}'});if(!response.ok)throw Object.assign(Error('unavailable'),{status:response.status});const data=await response.json();if(g!==generation)return;location.assign(data.url);}
        catch(error){if(g!==generation)return;if(error.status===409){busy=false;pay.disabled=false;await load();return;}message.textContent='Unable to start payment. Refresh reservation status and try again.';}
        finally{if(g===generation){busy=false;pay.disabled=false;}}
      });
      refresh.addEventListener('click',()=>{if(!busy)load();});
      window.addEventListener('pagehide',()=>{generation++;details.replaceChildren();pay.hidden=true;endpoint=null;busy=false;pay.disabled=false;});
      window.addEventListener('pageshow',load);
    })();
  </script>
</body>
</html>
