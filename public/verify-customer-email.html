<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex, nofollow">
  <title>Verify Your Email | ER Limousine Service</title>
  <script src="/verify-customer-email.js"></script><link rel="stylesheet" href="/account.css">
</head>
<body>
<header class="account-header"><a class="brand" href="/" aria-label="ER Limousine Service home"><span class="brand-monogram">ER</span><span class="brand-copy">LIMOUSINE SERVICE<small>LUXURY · RELIABILITY · ALWAYS ON TIME</small></span></a></header>
<main class="account-shell"><section class="auth-card" aria-labelledby="emailVerificationHeading">
  <p class="eyebrow">ER LIMOUSINE SERVICE</p><h1 id="emailVerificationHeading">Verify Your Email</h1>
  <p id="emailVerificationIntro" class="intro">Select Confirm Email to verify your email address.</p>
  <form id="emailVerificationForm" hidden>
    <div id="emailVerificationPasswordRow" class="form-field" hidden>
      <label for="emailVerificationPassword">Password used to create your account</label>
      <input id="emailVerificationPassword" type="password" autocomplete="current-password" minlength="10" maxlength="128" disabled>
    </div>
    <button id="emailVerificationSubmit" class="primary" type="submit">Confirm Email</button>
  </form>
  <p id="emailVerificationStatus" class="reset-message" role="status" aria-live="polite"></p>
  <p class="switch"><a id="emailVerificationRestart" href="/account.html#create" hidden>Start Again</a></p>
  <p class="switch"><a href="/account.html">Back to Log In</a></p>
  <noscript><p class="intro">Enable JavaScript and reopen the verification link from your email.</p></noscript>
</section></main>
<footer><span>ER Limousine Service</span><p>© ER Limousine Service LLC. All rights reserved.</p></footer>
</body>
</html>
